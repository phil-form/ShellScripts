server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les logs partent sur la sortie standard du conteneur :
    # c'est ce qui rend `docker logs` utile.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        # Indispensable pour une application à page unique (SPA) :
        # toute URL inconnue retombe sur index.html.
        try_files $uri $uri/ /index.html;
    }
}
