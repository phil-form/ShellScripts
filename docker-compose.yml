version: '3.9'

services:
  db:
    image: postgres:12-alpine
    networks:
      - esomusesobisback_default
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: postgres
      POSTGRES_DB: app

    ports:
      - '5435:5432'
    volumes:
      - ./:/init_db

networks:
  db-network:
    name: db-network
    driver: bridge